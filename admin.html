<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शास्त्राचार - एडमिन कंट्रोल पैनल</title>
    <style>
        :root {
            --primary: #8b0000;
            --secondary: #b8860b;
            --bg: #fdfbf7;
            --sidebar: #2c1a12;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg);
        }

        .sidebar {
            width: 250px;
            background-color: var(--sidebar);
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            text-align: center;
            color: var(--secondary);
            font-size: 22px;
            margin-bottom: 30px;
            border-bottom: 1px solid #442a1d;
            padding-bottom: 15px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #d3c4b3;
            padding: 15px 25px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .menu-btn:hover, .menu-btn.active {
            background-color: var(--primary);
            color: white;
            border-left: 4px solid var(--secondary);
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0d0b8;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2d7c5;
            max-width: 800px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #6a0000;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: white;
        }

        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .data-table th {
            background-color: #f5ecdf;
            color: var(--primary);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>शास्त्राचार एडमिन</h2>
        <button class="menu-btn active" onclick="switchTab('vedas')">🕉️ वेद एवं वेदाङ्ग</button>
        <button class="menu-btn" onclick="switchTab('astrology')">🔮 ज्योतिष व पंचांग</button>
        <button class="menu-btn" onclick="switchTab('vastu')">🏠 वास्तु शास्त्र</button>
        <button class="menu-btn" onclick="switchTab('sanskrit')">📖 संस्कृत व्याकरण</button>
        <button class="menu-btn" onclick="switchTab('modern')">🌐 आधुनिक विषय</button>
    </div>

    <div class="main-content">
        <a href="index.html" class="back-link">← मुख्य पोर्टल (Homepage) पर जाएँ</a>
        
        <div class="header">
            <h1 id="tabTitle">वेद एवं वेदाङ्ग प्रबंधन</h1>
            <span style="font-weight: bold; color: var(--secondary);">प्रशासक (Admin) Mode</span>
        </div>

        <div class="form-card">
            <h3 style="color: var(--primary); margin-top:0;">नया डेटा प्रविष्ट करें (Add Content)</h3>
            
            <form id="adminForm" onsubmit="event.preventDefault(); saveData();">
                <div class="form-group">
                    <label>विभाग (Category):</label>
                    <select id="categorySelect">
                        <option value="vedas">वेद / वेदाङ्ग / उपनिषद्</option>
                        <option value="astrology">ज्योतिष / पंचांग / मुहूर्त</option>
                        <option value="vastu">वास्तु दिशा / दोष निवारण</option>
                        <option value="sanskrit">संस्कृत (समास / छन्द / अलंकार / शब्दरूप)</option>
                        <option value="modern">आधुनिक विषय / नोट्स</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>शीर्षक / विषय (Title):</label>
                    <input type="text" id="contentTitle" placeholder="उदाहरण: ऋग्वेद परिचय या केवल समास सूत्र" required>
                </div>

                <div class="form-group">
                    <label>संस्कृत श्लोक / सूत्र (Optional):</label>
                    <input type="text" id="sanskritShloka" placeholder="जैसे: विशेषसंज्ञाविनिर्मुक्तः केवलसमासः">
                </div>

                <div class="form-group">
                    <label>विस्तृत विवरण एवं अर्थ (Description):</label>
                    <textarea id="contentBody" placeholder="यहाँ विवरण या अर्थ लिखें..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">सॉफ़्टवेयर में लाइव करें (Save)</button>
            </form>
        </div>

        <h3 style="margin-top: 40px; color: var(--primary);">हाल ही में जोड़ा गया डेटा</h3>
        <table class="data-table">
            <thead>
                <tr>
                    <th>विभाग</th>
                    <th>शीर्षक</th>
                    <th>श्लोक / सूत्र</th>
                    <th>स्थिति</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr>
                    <td>वेद एवं वेदाङ्ग</td>
                    <td>पाणिनीय शिक्षा (वेदाङ्ग)</td>
                    <td>छन्दः पादौ तु वेदस्य...</td>
                    <td><span style="color:green; font-weight:bold;">Active</span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function switchTab(tabName) {
            const titles = {
                'vedas': 'वेद एवं वेदाङ्ग प्रबंधन',
                'astrology': 'ज्योतिष व पंचांग प्रबंधन',
                'vastu': 'वास्तु शास्त्र प्रबंधन',
                'sanskrit': 'संस्कृत व्याकरण व साहित्य प्रबंधन',
                'modern': 'आधुनिक विषय प्रबंधन'
            };
            document.getElementById('tabTitle').innerText = titles[tabName];
            document.getElementById('categorySelect').value = tabName;
            
            const buttons = document.querySelectorAll('.menu-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function saveData() {
            const title = document.getElementById('contentTitle').value;
            const shloka = document.getElementById('sanskritShloka').value || '-';
            const category = document.getElementById('categorySelect').options[document.getElementById('categorySelect').selectedIndex].text;

            const tableBody = document.getElementById('dataTableBody');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>${category}</td>
                <td>${title}</td>
                <td>${shloka}</td>
                <td><span style="color:green; font-weight:bold;">Active</span></td>
            `;
            tableBody.prepend(newRow);

            alert('सफलतापूर्वक ' + title + ' जोड़ दिया गया है!');
            document.getElementById('adminForm').reset();
        }
    </script>
</body>
</html>
